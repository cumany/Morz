name: Validate registry

on:
  pull_request:
    paths:
      - "registry/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate registry/index.json
        run: node registry/validate.mjs
